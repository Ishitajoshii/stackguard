# Copy into an isolated CODEX_HOME and replace paths/profile as needed.
# Start sg-collect on loopback first. This template targets Codex 0.166.0.
# Native capture remains a live acceptance check, not a unit-test fixture.
[mcp_servers.stackguard]
command = "C:/path/to/stackguard/bin/nhi-probe.exe"
args = ["proxy", "--mode", "stdio", "--agent", "codex", "--client", "codex-cli", "--out", "C:/path/to/stackguard/captures/new-run/local", "--", "C:/path/to/stackguard/bin/oss-scout.exe", "bridge", "--profile", "C:/path/to/stackguard/profiles/default.yaml", "--summary", "C:/path/to/stackguard/profiles/summary.json", "--endpoint", "http://127.0.0.1:8765/mcp", "--out", "C:/path/to/stackguard/captures/new-run/bridge"]
env_vars = ["AWS_PROFILE", "AWS_REGION"]

[otel]
log_user_prompt = false

[otel.exporter."otlp-http"]
endpoint = "http://127.0.0.1:4318/v1/logs"
protocol = "json"
